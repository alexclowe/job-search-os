<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8da6"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#0b1220"/>

  <!-- guard band -->
  <rect x="40" y="40" width="1120" height="440" rx="18" fill="none" stroke="#ffb86b" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  <text x="70" y="70" fill="#ffb86b" font-size="13" font-weight="700" letter-spacing="2">GUARDRAILS, ALWAYS ON: IS THIS REAL? · MINIMUM PAY · EVERY CLAIM HOLDS UP · NOTHING UNDERSOLD · NO INVENTION</text>
  <text x="70" y="465" fill="#7f8da6" font-size="12">They flag; the decisions stay yours. Nothing is sent, submitted, accepted, or declined without your click.</text>

  <!-- you -->
  <rect x="70" y="200" width="170" height="110" rx="12" fill="#101b34" stroke="#26334f"/>
  <text x="155" y="240" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="700">You</text>
  <text x="155" y="264" text-anchor="middle" fill="#c9d4e8" font-size="12">"tailor and apply"</text>
  <text x="155" y="282" text-anchor="middle" fill="#c9d4e8" font-size="12">or "open my command center"</text>

  <!-- command center -->
  <rect x="290" y="180" width="220" height="150" rx="12" fill="#170c2a" stroke="#3b2a5e"/>
  <text x="400" y="212" text-anchor="middle" fill="#ffb86b" font-size="12" font-weight="700" letter-spacing="2">COMMAND CENTER</text>
  <text x="400" y="240" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="700">/jobsearch-os</text>
  <text x="400" y="264" text-anchor="middle" fill="#c9d4e8" font-size="12">reads your profile + trackers,</text>
  <text x="400" y="282" text-anchor="middle" fill="#c9d4e8" font-size="12">shows five jobs, runs the one you pick</text>
  <text x="400" y="308" text-anchor="middle" fill="#7f8da6" font-size="11">first run: "Try it on a sample"</text>

  <!-- jobs -->
  <g font-size="12" fill="#f5f5f5">
    <rect x="560" y="100" width="220" height="44" rx="8" fill="#101b34" stroke="#26334f"/><text x="670" y="127" text-anchor="middle">Tailor &amp; apply</text>
    <rect x="560" y="156" width="220" height="44" rx="8" fill="#101b34" stroke="#26334f"/><text x="670" y="183" text-anchor="middle">Work my inbox</text>
    <rect x="560" y="212" width="220" height="44" rx="8" fill="#101b34" stroke="#26334f"/><text x="670" y="239" text-anchor="middle">Prep for an interview</text>
    <rect x="560" y="268" width="220" height="44" rx="8" fill="#101b34" stroke="#26334f"/><text x="670" y="295" text-anchor="middle">Follow up &amp; negotiate</text>
    <rect x="560" y="324" width="220" height="44" rx="8" fill="#101b34" stroke="#26334f"/><text x="670" y="351" text-anchor="middle">Run my weekly review</text>
  </g>
  <text x="670" y="392" text-anchor="middle" fill="#7f8da6" font-size="11">each reads a profession archetype when you name one</text>

  <!-- connectors -->
  <rect x="840" y="110" width="300" height="130" rx="12" fill="#101b34" stroke="#26334f"/>
  <text x="990" y="138" text-anchor="middle" fill="#ffb86b" font-size="12" font-weight="700" letter-spacing="2">YOUR TOOLS (OPTIONAL)</text>
  <text x="990" y="164" text-anchor="middle" fill="#f5f5f5" font-size="13">Gmail drafts · Calendar holds · Drive files</text>
  <text x="990" y="186" text-anchor="middle" fill="#c9d4e8" font-size="12">personal accounts only</text>
  <text x="990" y="214" text-anchor="middle" fill="#ffb86b" font-size="12" font-weight="700">every action waits for your approval</text>

  <!-- trackers -->
  <rect x="840" y="270" width="300" height="130" rx="12" fill="#101b34" stroke="#26334f"/>
  <text x="990" y="298" text-anchor="middle" fill="#ffb86b" font-size="12" font-weight="700" letter-spacing="2">LIVING TRACKERS</text>
  <text x="990" y="324" text-anchor="middle" fill="#f5f5f5" font-size="13">Application Board · Story Bank</text>
  <text x="990" y="344" text-anchor="middle" fill="#f5f5f5" font-size="13">Offer Tracker · Weekly Search Log</text>
  <text x="990" y="364" text-anchor="middle" fill="#f5f5f5" font-size="13">People (who you know where)</text>
  <text x="990" y="388" text-anchor="middle" fill="#c9d4e8" font-size="12">artifacts you edit in place; the next job picks up here</text>

  <!-- arrows -->
  <line x1="240" y1="255" x2="288" y2="255" stroke="#7f8da6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="255" x2="558" y2="234" stroke="#7f8da6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="200" x2="838" y2="175" stroke="#7f8da6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="290" x2="838" y2="335" stroke="#7f8da6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 990 400 C 990 430, 400 440, 400 332" fill="none" stroke="#7f8da6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="700" y="447" text-anchor="middle" fill="#7f8da6" font-size="11">trackers feed the next run</text>
</svg>
